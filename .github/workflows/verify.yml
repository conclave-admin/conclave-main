name: Verify Conclave
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    # if: false
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres.ueauwvdkcupdzigzkyps
          POSTGRES_PASSWORD: VTdEy65jxbPYCRvZ
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres.ueauwvdkcupdzigzkyps:VTdEy65jxbPYCRvZ@aws-0-eu-central-1.pooler.supabase.com/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Apply migrations to fresh PostgreSQL
        run: npm run migrate
      - name: Verify migration rerun
        run: npm run migrate
      - name: Verify API queries and permissions against PostgreSQL
        run: npm run test:db
        env:
          DATABASE_URL: postgresql://postgres.ueauwvdkcupdzigzkyps:VTdEy65jxbPYCRvZ@aws-0-eu-central-1.pooler.supabase.com:5432/postgres
  client:
    # if: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
