services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: platform_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d platform_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The backend service was missing entirely, so `docker compose up` only ever
  # gave you the datastores. Run migrations with:
  #   docker compose run --rm backend node database/migrate.js
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Service names, not localhost: inside the compose network the datastores
      # are reachable by service name. backend/.env is deliberately not baked
      # into the image (see backend/.dockerignore), so config arrives here.
      NODE_ENV: development
      PORT: "5000"
      DATABASE_URL: postgres://app:app@postgres:5432/platform_dev
      REDIS_URL: redis://redis:6379
      CLIENT_ORIGIN: http://localhost:5173
      # Dev-only fallbacks. Override with a real .env or your orchestrator's
      # secret store; these exist so the stack boots without one.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-refresh-secret-change-me}
    ports:
      - "5000:5000"
    # Live-mounted so editing code on the host does not require a rebuild.
    # node_modules is deliberately NOT mounted — the image's musl-built copy
    # must win, or bcrypt fails to load.
    volumes:
      - ./backend/src:/app/src
      - ./backend/database:/app/database

volumes:
  pgdata:
